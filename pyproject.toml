##
## https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = "oremi-isinmi-agent"
version = "1.0.0-beta7"
description = "A smart scheduler for alarms, timers, reminders, and calendar events, powered by local LLMs"
keywords = ["forecast", "air quality", "pollen", "geocoding"]
authors = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
maintainers = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11,<3.12"

classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "aiosqlite>=0.21.0",
  "faiss-cpu>=1.11.0",
  "fastapi[standard]>=0.115.12",
  "hf-xet>=1.1.0",
  "hishel>=0.1.2",
  "isodate>=0.7.2",
  "langid>=1.1.6",
  "ollama>=0.4.8",
  "oremi-core>=2.5.3",
  "pytz>=2025.2",
  "sentence-transformers>=4.1.0",
  "sqlalchemy>=2.0.41",
  "symspellpy>=6.9.0",
]

[project.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Documentation" = "https://demsking.gitlab.io/oremi-isinmi-agent"
"Source" = "https://gitlab.com/demsking/oremi-isinmi-agent"
"Issues" = "https://gitlab.com/demsking/oremi-isinmi-agent/-/issues"

[dependency-groups]
dev = [
  "autopep8>=2.3.2",
  "bandit>=1.8.3",
  "pylint>=3.3.7",
  "pyroma>=4.2",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "python-dotenv>=1.1.0",
  "python-slugify>=8.0.4",
  "reorder-python-imports>=3.14.0",
  "trio>=0.30.0",
]

[tool.skjold]
sources = ["pyup", "gemnasium", "osv", "pypa"]
report_only = false

[tool.pytest.ini_options]
python_functions = "test_"
